<div class="employee-page">
  <div class="page-header">
    <div>
      <h1>Employees</h1>
      <p class="page-subtitle">Manage all employees in the organization</p>
    </div>
    <button mat-raised-button color="primary" *ngIf="canEdit" (click)="openAdd()">
      <mat-icon>add</mat-icon> Add Employee
    </button>
  </div>

  <mat-card class="employee-card">
    <div class="employee-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search employees</mat-label>
        <input matInput [formControl]="searchControl" placeholder="Name, code, or email..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="(employees$ | async) ?? []" class="employee-table">
        <ng-container matColumnDef="employeeCode">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let row">
            <span class="emp-code">{{ row.employeeCode }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">
            <div class="emp-name">{{ row.fullName }}</div>
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <ng-container matColumnDef="departmentName">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let row">
            <span class="badge badge-dept">{{ row.departmentName }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="roleName">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let row">
            <span class="badge badge-role" [class.badge-admin]="row.roleName === 'Admin'" [class.badge-manager]="row.roleName === 'Manager'">
              {{ row.roleName }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" matTooltip="Edit" *ngIf="canEdit" (click)="openEdit(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="accent" matTooltip="Change Password" *ngIf="canChangePassword" (click)="openChangePassword(row)">
              <mat-icon>lock</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Delete" *ngIf="canDelete" (click)="deleteEmployee(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div class="no-data">No employees found</div>
          </td>
        </tr>
      </table>
    </div>
  </mat-card>
</div>
