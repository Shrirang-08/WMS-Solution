<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__nav">
    <div class="shell__brand">
      <div class="shell__logo">WMS</div>
      <div>
        <strong>Workforce</strong>
        <p>Management System</p>
      </div>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard">Dashboard</a>
      <a mat-list-item routerLink="/employees" *ngIf="authService.role === 'Admin' || authService.role === 'Manager'">Employees</a>
      <a mat-list-item routerLink="/departments" *ngIf="authService.role === 'Admin'">Departments</a>
      <a mat-list-item routerLink="/manager" *ngIf="authService.role === 'Manager'">Manager Dashboard</a>
      <a mat-list-item routerLink="/me" *ngIf="authService.role === 'Staff'">My Activity</a>
      <a mat-list-item routerLink="/attendance">Attendance</a>
      <a mat-list-item routerLink="/leaves">Leaves</a>
      <a mat-list-item routerLink="/projects">Projects</a>
      <a mat-list-item routerLink="/reports" *ngIf="authService.role === 'Admin'">Reports</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell__toolbar">
      <span class="shell__title">Enterprise Workforce Management</span>
      <span class="shell__spacer"></span>
      <button mat-button (click)="logout()">Logout</button>
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
