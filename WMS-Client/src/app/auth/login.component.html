<div class="login-page">
  <mat-card class="login-card">
    <div class="login-card__header">
      <div class="login-card__badge">WMS</div>
      <h1>Sign in</h1>
      <p>Use the seeded admin account to access the system.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <div class="login-form__error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Login' }}
      </button>

      <p class="login-form__hint">Admin / Admin@123</p>
      <p class="login-form__hint">New user? <a routerLink="/register">Register here</a></p>
    </form>
  </mat-card>
</div>
