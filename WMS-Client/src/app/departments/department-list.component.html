<mat-card>
  <div class="departments__header">
    <h2>Departments</h2>
    <div>
      <button mat-stroked-button color="primary" *ngIf="canEdit()" (click)="openAdd()">Add Department</button>
    </div>
  </div>

  <mat-table [dataSource]="(departments$ | async) || []" class="mat-elevation-z1">

  <!-- reference dialog component so the standalone component compiler includes it (not rendered) -->
  <ng-container *ngIf="false"><app-department-dialog></app-department-dialog></ng-container>
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>#</mat-header-cell>
      <mat-cell *matCellDef="let dept">{{ dept.id }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let dept">{{ dept.name }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef>Description</mat-header-cell>
      <mat-cell *matCellDef="let dept">{{ dept.description }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef></mat-header-cell>
      <mat-cell *matCellDef="let dept">
        <button mat-icon-button color="primary" (click)="openEdit(dept)" *ngIf="canEdit()"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="delete(dept.id)" *ngIf="canEdit()"><mat-icon>delete</mat-icon></button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>
</mat-card>
