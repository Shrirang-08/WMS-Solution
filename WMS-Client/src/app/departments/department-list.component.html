<div class="dept-page">
  <div class="page-header">
    <div>
      <h1>Departments</h1>
      <p class="page-subtitle">Manage organizational departments</p>
    </div>
    <button mat-raised-button color="primary" *ngIf="canEdit()" (click)="openAdd()">
      <mat-icon>add</mat-icon> Add Department
    </button>
  </div>

  <mat-card class="dept-card">
    <div class="table-container">
      <table mat-table [dataSource]="(departments$ | async) || []">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let dept">{{ dept.id }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let dept">
            <span class="dept-name">{{ dept.name }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let dept" class="dept-desc">{{ dept.description || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let dept">
            <button mat-icon-button color="primary" matTooltip="Edit" (click)="openEdit(dept)" *ngIf="canEdit()">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Delete" (click)="delete(dept.id)" *ngIf="canEdit()">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length"><div class="no-data">No departments</div></td>
        </tr>
      </table>
    </div>
  </mat-card>
</div>
