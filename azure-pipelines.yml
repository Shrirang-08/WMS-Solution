trigger:
  branches:
    include:
      - main
      - dev
      - feature/*

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.x'
  nodeVersion: '20.x'

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildBackend
        displayName: 'Build .NET Backend'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run tests'
            inputs:
              command: 'test'
              projects: '**/WMS.Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --collect "Code Coverage"'

          - task: DotNetCoreCLI@2
            displayName: 'Publish API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'WMS.API/WMS.API.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/backend'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)/backend'
              artifactName: 'backend-drop'

      - job: BuildFrontend
        displayName: 'Build Angular Frontend'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: |
              cd WMS-Client
              npm ci
            displayName: 'Install npm deps'

          - script: |
              cd WMS-Client
              npx ng build --configuration production
            displayName: 'Build Angular'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'WMS-Client/dist/WMS-Client'
              artifactName: 'frontend-drop'

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployBackend
        displayName: 'Deploy API'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'backend-drop'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'wms-api-app'
                    package: '$(Pipeline.Workspace)/backend-drop/**/*.zip'
                    deploymentMethod: 'zipDeploy'

                - task: AzureAppServiceSettings@1
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appName: 'wms-api-app'
                    appSettings: |
                      [
                        { "name": "ASPNETCORE_ENVIRONMENT", "value": "Production" },
                        { "name": "ConnectionStrings__DefaultConnection", "value": "Server=$(SqlServerFqdn);Database=$(SqlDatabaseName);User Id=$(SqlAdminUser);Password=$(SqlAdminPassword);TrustServerCertificate=True;" },
                        { "name": "Jwt__Key", "value": "$(JwtKey)" }
                      ]

      - deployment: DeployFrontend
        displayName: 'Deploy Angular App'
        environment: 'production'
        dependsOn: []
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'frontend-drop'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    appType: 'webAppLinux'
                    appName: 'wms-client-app'
                    package: '$(Pipeline.Workspace)/frontend-drop'
                    deploymentMethod: 'zipDeploy'
